<app-navbar></app-navbar>
<app-header titulo="Calificar pedido"></app-header>

<div class="container my-3 mb-5 pb-5">

  <!-- Mensaje de carga -->
  <div *ngIf="cargando" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
    <p class="mt-2">Cargando información del pedido...</p>
  </div>

  <div *ngIf="mensajeExito"
       class="alert mb-3"
       [ngClass]="{'alert-success': !mensajeExito.startsWith('⚠️'), 'alert-warning': mensajeExito.startsWith('⚠️')}">
    {{ mensajeExito }}
  </div>

  <div *ngIf="!cargando && pedidoData" class="card p-3">
    <div class="d-flex justify-content-between align-items-center">
      <div>
        <div class="fw-bold">Pedido #{{ pedidoId }}</div>
        <small class="text-muted">{{ pedidoData.fecha | date:'medium' }}</small>
      </div>
      <span class="badge text-bg-success">{{ pedidoData.estado }}</span>
    </div>
    <hr>

    <!-- Producto a calificar -->
    <div class="mb-3">
      <label for="producto" class="form-label">¿Qué producto querés calificar?</label>
      <select id="producto" class="form-select" [(ngModel)]="productoId">
        <option *ngFor="let prod of pedidoData.productos" [ngValue]="prod.id">{{ prod.nombre }}</option>
      </select>
    </div>

    <div class="text-center mb-2">¿Cómo estuvo?</div>

    <!-- Estrellas -->
    <div class="text-center mb-3 rating-stars" (mouseleave)="resetHoverRating()">
      <i *ngFor="let star of [1, 2, 3, 4, 5]"
         class="bi estrella"
         [ngClass]="{'bi-star-fill': star <= (hoverRating || rating), 'bi-star': star > (hoverRating || rating)}"
         (mouseenter)="setHoverRating(star)"
         (click)="setRating(star)">
      </i>
    </div>

    <div class="mb-3">
      <label for="comentario" class="form-label">Comentario (opcional)</label>
      <textarea id="comentario"
                [(ngModel)]="comentario"
                class="form-control"
                rows="3"
                maxlength="255"
                placeholder="Contanos tu experiencia..."></textarea>
    </div>

    <!-- Imagen (opcional) -->
    <div class="mb-3">
      <label for="imagen" class="form-label">
        <i class="bi bi-camera"></i> Foto (opcional, máx. {{ MAX_MB }} MB)
      </label>
      <input #inputImagen id="imagen" type="file" class="form-control"
             accept="image/png, image/jpeg, image/gif, image/webp"
             (change)="onImagenSeleccionada($event)">

      <div *ngIf="previewImagen" class="preview mt-2">
        <img [src]="previewImagen" alt="Vista previa de la imagen" class="img-thumbnail">
        <button type="button" class="btn btn-sm btn-outline-danger mt-1" (click)="quitarImagen(inputImagen)">
          <i class="bi bi-trash"></i> Quitar imagen
        </button>
      </div>
    </div>

    <button
      class="btn btn-success w-100"
      (click)="enviarCalificacion()"
      [disabled]="enviando || rating === 0">
      <span *ngIf="enviando" class="spinner-border spinner-border-sm me-2"></span>
      {{ enviando ? 'Enviando...' : 'Enviar calificación' }}
    </button>
  </div>
</div>
